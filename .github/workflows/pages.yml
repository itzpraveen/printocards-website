# Builds the v2 site and publishes it to GitHub Pages at
# https://itzpraveen.github.io/printocards-website/ on every push to the v2 branch.
# The Pages build is a preview: it is marked noindex so it never competes in search
# with printocards.com. Production builds (plain `npm run build`) are unaffected.
name: Deploy v2 preview to GitHub Pages

on:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://itzpraveen.github.io
          BASE_PATH: /printocards-website
          PUBLIC_PREVIEW: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
